################
# Loki metrics #
################

# total CPU usage by all loki pods - per pod is not included here as that is collected above
- query: (sum(pod:container_cpu_usage:sum{namespace="netobserv-loki", pod=~"loki.*"}) or on() vector(0))
  metricName: cpuLokiTotals

# total RSS by all loki pods - per pod is not included here as that is collected above
- query: (sum(container_memory_rss{namespace="netobserv-loki", pod=~"loki.*", container=""}) or on() vector(0))
  metricName: rssLokiTotals

# total working set memory by all loki pods - per pod is not included here as that is collected above
- query: (sum(container_memory_working_set_bytes{namespace="netobserv-loki", pod=~"loki.*", container=""}) or on() vector(0))
  metricName: workingsetLokiTotals

# lokistack PVC usage averaging over 5 mins period
- query: sum((avg_over_time(kubelet_volume_stats_used_bytes{namespace="netobserv-loki", persistentvolumeclaim=~".*loki.*"}[5m]))) or on() vector(0)
  metricName: lokiStorageUsage

# total loki records written
- query: (sum(netobserv_loki_sent_entries_total) or on() vector(0))
  metricName: lokiRecordsWritten

# loki records written per minute
- query: (sum(rate(netobserv_loki_sent_entries_total[1m])*60) or on() vector(0))
  metricName: lokiRecordsWrittenPerMinute

# total records dropped while sending to Loki (inverse of netobserv_loki_sent_entries_total)
- query: (sum(netobserv_loki_dropped_entries_total) or on() vector(0))
  metricName: lokiRecordsDropped

# loki flow drops ratio to numbers of flows written in 1 min.
- query: sum(rate(netobserv_loki_dropped_entries_total[1m])) / sum(rate(netobserv_loki_sent_entries_total[1m])) > 0.05 or on() vector(0)
  metricName: lokiRecordsDroppedRatio

# total records dropped while sending to Loki per minute (inverse of netobserv_loki_sent_entries_total)
- query: (sum(rate(netobserv_loki_dropped_entries_total[1m])*60) or on() vector(0))
  metricName: lokiRecordsDroppedPerMinute

