###############
# KPI metrics #
###############

# total flows processed
- query: sum(netobserv_ingest_flows_processed OR on() vector(0))
  metricName: nFlowsProcessedTotals

# total flows processed per minute
- query: sum(rate(netobserv_ingest_flows_processed[1m])*60 OR on() vector(0))
  metricName: nFlowsProcessedPerMinuteTotals

# total flows processed from workload namespaces
- query: sum(netobserv_namespace_flows_total{SrcK8S_Namespace=~"node-density-heavy.*|ingress-perf|cluster-density.*"}) OR sum(netobserv_workload_flows_total{SrcK8S_Namespace=~"node-density-heavy.*|ingress-perf|cluster-density.*"}) OR on() vector(0)
  metricName: nWorkloadFlowsProcessedTotals

# total flows processed from workload namespaces per minute
- query: sum(rate(netobserv_namespace_flows_total{SrcK8S_Namespace=~"node-density-heavy.*|ingress-perf|cluster-density.*"}[1m])*60) OR sum(rate(netobserv_workload_flows_total{SrcK8S_Namespace=~"node-density-heavy.*|ingress-perf|cluster-density.*"}[1m])*60) OR on() vector(0)
  metricName: nWorkloadFlowsProcessedPerMinuteTotals

# total bytes processed from workload namespaces by netobserv
- query: sum(rate(netobserv_workload_ingress_bytes_total{DstK8S_Namespace=~"node-density-heavy.*|ingress-perf|cluster-density.*",SrcK8S_Type!="Service",DstK8S_Type!="Service"}[1m])*60) OR on() vector(0)
  metricName: nWorkloadBytesProcessedPerMinuteNetobserv

# total bytes processed from workload namespaces by cadvisor / other means
- query: sum(rate(container_network_receive_bytes_total{job="kubelet", metrics_path="/metrics/cadvisor", cluster="", namespace=~"node-density-heavy.*|ingress-perf|cluster-density.*", interface="eth0"}[1m])*60) OR on() vector(0)
  metricName: nWorkloadBytesProcessedPerMinuteCadvisor

# total flows errored
- query:
    (sum(increase(netobserv_agent_errors_total{severity!="low"}[1m])) OR on() vector(0))
    + (sum(increase(netobserv_ingest_errors[1m])) OR on() vector(0))
    + (sum(increase(netobserv_encode_prom_errors[1m])) OR on() vector(0))
    + (sum(increase(netobserv_loki_batch_retries_total[1m])) OR on() vector(0))
  metricName: nFlowsErroredTotals

# flow errored ratio for flows received in 1 min period
- query:
    (
      (
        (sum(increase(netobserv_agent_errors_total{severity!="low"}[1m])) OR on() vector(0))
        + (sum(increase(netobserv_ingest_errors[1m])) OR on() vector(0))
        + (sum(increase(netobserv_encode_prom_errors[1m])) OR on() vector(0))
        + (sum(increase(netobserv_loki_batch_retries_total[1m])) OR on() vector(0))
      ) / sum(increase(netobserv_ingest_flows_processed[1m]))
    ) > 0.05 or on() vector(0)
  metricName: nFlowsErroredRatio

# total flows errored per minute
- query:
    (sum(rate(netobserv_agent_errors_total{severity!="low"}[1m])*60) OR on() vector(0))
    + (sum(rate(netobserv_ingest_errors[1m])*60) OR on() vector(0))
    + (sum(rate(netobserv_encode_prom_errors[1m])*60) OR on() vector(0))
    + (sum(rate(netobserv_loki_batch_retries_total[1m])*60) OR on() vector(0))
  metricName: nFlowsErroredPerMinuteTotals

# flows processed by ingester per minute aggregated by FLP pods
- query: (sum(rate(netobserv_ingest_flows_processed[1m])*60) by (pod) OR on() vector(0))
  metricName: nFlowsProcessedPerMinute

# flows errored by ingester per minute aggregated by FLP pods
- query: (sum(rate(netobserv_ingest_errors[1m])*60) by (pod) OR on() vector(0))
  metricName: nFlowsErroredPerMinute

#####################
# NetObserv metrics #
#####################

# netobserv pods CPU usage
- query: (pod:container_cpu_usage:sum{namespace=~".*netobserv.*"} OR on() vector(0))
  metricName: cpuUsage

# overall memory usage for po
- query: (sum(container_memory_usage_bytes{namespace=~".*netobserv.*", container=""}) by (container, pod, namespace, node) OR on() vector(0))
  metricName: memoryUsage

# netobserv pods memory usage (RSS) - eBPF is omitted here as that is collected below
- query: (sum(container_memory_rss{namespace=~".*netobserv.*", container=""}) by (container, pod, namespace, node) OR on() vector(0))
  metricName: memoryUsageRSS

# netobserv pods memory usage (Working Set) - eBPF is omitted here as that is collected below
- query: (sum(container_memory_working_set_bytes{namespace=~".*netobserv.*", container=""}) by (container, pod, namespace, node) OR on() vector(0))
  metricName: memoryUsageWorkingSet

################
# eBPF metrics #
################

# total CPU usage by eBPF
- query: (sum(pod:container_cpu_usage:sum{namespace="netobserv-privileged"}) or on() vector(0))
  metricName: cpuEBPFTotals

# total memory usage by all eBPF pods
- query: (sum(container_memory_usage_bytes{namespace="netobserv-privileged", container=""}) or on() vector(0))
  metricName: totalEBPFMemoryUsage

# total RSS by all eBPF pods
- query: (sum(container_memory_rss{namespace="netobserv-privileged", container=""}) or on() vector(0))
  metricName: rssEBPFTotals

# total working set memory by all eBPF pods
- query: (sum(container_memory_working_set_bytes{namespace="netobserv-privileged", container=""}) or on() vector(0))
  metricName: workingsetEBPFTotals

# eBPF pods memory usage (RSS)
- query: (sum(container_memory_rss{namespace="netobserv-privileged", container=""}) by (container, pod, namespace, node) or on() vector(0))
  metricName: ebpfMemoryUsageRSS

# eBPF pods memory usage (Working Set)
- query: (sum(container_memory_working_set_bytes{namespace="netobserv-privileged", container=""}) by (container, pod, namespace, node) or on() vector(0))
  metricName: ebpfMemoryUsageWorkingSet

# eBPF drops
- query: (sum(rate(netobserv_agent_dropped_flows_total[1m])) or on() vector(0))
  metricName: ebpfFlowsDroppedTotals

# eBPF flow drops ratio to number of evicted flows in 1 min. Note that netobserv_agent_dropped_flows_total may count unaggregated flows, which might result in a high ratio not representative of the actual (aggregated) flows being dropped.
- query: (((sum(rate(netobserv_agent_dropped_flows_total[1m])) or on() vector(0)) / (sum(rate(netobserv_agent_evicted_flows_total[1m])) or on() vector(0))) > 0.05) or on() vector(0)
  metricName: ebpfFlowsDroppedRatio

# ebpf Ring buffer/Map Ratio
- query: ((sum(rate(netobserv_agent_evicted_flows_total{source="accounter"}[1m])) OR on() vector(0)) / (sum(rate(netobserv_agent_evicted_flows_total{source="hashmap"}[1m])) > 0)) OR on() vector(0)
  metricName: ebpfRingBufferMapRatioTotals

